apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-system

bases:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent-redator
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: redator
                resources:
                  requests:
                    cpu: "50m"
                    memory: "64Mi"
                  limits:
                    cpu: "200m"
                    memory: "256Mi"
    target:
      kind: Deployment
      name: agent-redator
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent-triador
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: triador
                resources:
                  requests:
                    cpu: "50m"
                    memory: "128Mi"
                  limits:
                    cpu: "200m"
                    memory: "512Mi"
    target:
      kind: Deployment
      name: agent-triador
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent-especialista
      spec:
        replicas: 0
        template:
          spec:
            containers:
              - name: especialista
                resources:
                  requests:
                    cpu: "100m"
                    memory: "256Mi"
                  limits:
                    cpu: "500m"
                    memory: "1Gi"
    target:
      kind: Deployment
      name: agent-especialista
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent-handoff
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: handoff
                resources:
                  requests:
                    cpu: "50m"
                    memory: "128Mi"
                  limits:
                    cpu: "200m"
                    memory: "512Mi"
    target:
      kind: Deployment
      name: agent-handoff

configMapGenerator:
  - name: agent-config
    behavior: merge
    literals:
      - environment=development
      - log-level=DEBUG
      - s3-bucket=agent-incidents-dev

images:
  - name: agent-redator
    newTag: dev
  - name: agent-triador
    newTag: dev
  - name: agent-especialista
    newTag: dev
  - name: agent-handoff
    newTag: dev

commonLabels:
  environment: development