apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-triador
  namespace: agent-system
  labels:
    app: agent-triador
    component: triador
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-triador
  template:
    metadata:
      labels:
        app: agent-triador
        component: triador
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agent-triador
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: triador
          image: agent-triador:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: INPUT_PATH
              value: "/data/in"
            - name: OUTPUT_PATH
              value: "/data/out"
            - name: MODELO_CLASSIFICACAO
              value: "keyword"
            - name: THRESHOLD_CONFIANCA
              value: "0.7"
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: s3-bucket
                  optional: true
            - name: LOKI_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: loki-url
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agent-data-pvc
        - name: config
          configMap:
            name: agent-triador-config
---
apiVersion: v1
kind: Service
metadata:
  name: agent-triador
  namespace: agent-system
  labels:
    app: agent-triador
spec:
  selector:
    app: agent-triador
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP