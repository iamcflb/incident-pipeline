apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-triador
  namespace: agent-system
  labels:
    app: agent-triador
    component: triador
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-triador
  template:
    metadata:
      labels:
        app: agent-triador
        component: triador
    spec:
      serviceAccountName: agent-triador
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: triador
          image: agent-triador:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: INPUT_PATH
              value: "/data/in"
            - name: OUTPUT_PATH
              value: "/data/out"
            - name: MODELO_CLASSIFICACAO
              value: "keyword"
            - name: THRESHOLD_CONFIANCA
              value: "0.7"
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: s3-bucket
                  optional: true
            - name: LOKI_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: loki-url
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agent-data-pvc