apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-handoff
  namespace: agent-system
  labels:
    app: agent-handoff
    component: handoff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-handoff
  template:
    metadata:
      labels:
        app: agent-handoff
        component: handoff
    spec:
      serviceAccountName: agent-handoff
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: handoff
          image: agent-handoff:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: INPUT_PATH
              value: "/data/in"
            - name: OUTPUT_PATH
              value: "/data/out"
            - name: CANAIS
              value: "slack,jira"
            - name: JIRA_PROJECT_KEY
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: jira-project-key
                  optional: true
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: slack-webhook-url
                  optional: true
            - name: JIRA_URL
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: jira-url
                  optional: true
            - name: JIRA_USER
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: jira-user
                  optional: true
            - name: JIRA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: jira-token
                  optional: true
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: s3-bucket
                  optional: true
            - name: LOKI_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: loki-url
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agent-data-pvc