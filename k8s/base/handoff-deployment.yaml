apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-handoff
  namespace: agent-system
  labels:
    app: agent-handoff
    component: handoff
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-handoff
  template:
    metadata:
      labels:
        app: agent-handoff
        component: handoff
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agent-handoff
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: handoff
          image: agent-handoff:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: INPUT_PATH
              value: "/data/in"
            - name: OUTPUT_PATH
              value: "/data/out"
            - name: CANAIS
              value: "slack,jira"
            - name: JIRA_PROJECT_KEY
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: jira-project-key
                  optional: true
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: slack-webhook-url
                  optional: true
            - name: JIRA_URL
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: jira-url
                  optional: true
            - name: JIRA_USER
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: jira-user
                  optional: true
            - name: JIRA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: jira-token
                  optional: true
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: s3-bucket
                  optional: true
            - name: LOKI_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: loki-url
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agent-data-pvc
        - name: config
          configMap:
            name: agent-handoff-config
---
apiVersion: v1
kind: Service
metadata:
  name: agent-handoff
  namespace: agent-system
  labels:
    app: agent-handoff
spec:
  selector:
    app: agent-handoff
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP