apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-especialista
  namespace: agent-system
  labels:
    app: agent-especialista
    component: especialista
spec:
  replicas: 0
  selector:
    matchLabels:
      app: agent-especialista
  template:
    metadata:
      labels:
        app: agent-especialista
        component: especialista
    spec:
      serviceAccountName: agent-especialista
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: especialista
          image: agent-especialista:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: INPUT_PATH
              value: "/data/in"
            - name: OUTPUT_PATH
              value: "/data/out"
            - name: USAR_LLM
              value: "false"
            - name: MODELO_LLM
              value: "gpt-4"
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: s3-bucket
                  optional: true
            - name: LOKI_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: loki-url
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agent-data-pvc