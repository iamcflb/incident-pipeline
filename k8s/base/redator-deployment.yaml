apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-redator
  namespace: agent-system
  labels:
    app: agent-redator
    component: redator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-redator
  template:
    metadata:
      labels:
        app: agent-redator
        component: redator
    spec:
      serviceAccountName: agent-redator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: redator
          image: agent-redator:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: INPUT_PATH
              value: "/data/in"
            - name: OUTPUT_PATH
              value: "/data/out"
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: s3-bucket
                  optional: true
            - name: LOKI_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: loki-url
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agent-data-pvc