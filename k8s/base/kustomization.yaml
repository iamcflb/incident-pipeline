apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-system

resources:
  - namespace.yaml
  - pvc.yaml
  - rbac.yaml
  - redator-deployment.yaml
  - triador-deployment.yaml
  - especialista-deployment.yaml
  - handoff-deployment.yaml

configMapGenerator:
  - name: agent-config
    literals:
      - s3-bucket=agent-incidents-prod
      - loki-url=http://loki.monitoring:3100
      - jira-project-key=INC

secretGenerator:
  - name: agent-secrets
    literals:
      - slack-webhook-url=
      - jira-url=
      - jira-user=
      - jira-token=
      - smtp-host=
      - smtp-port=587
      - smtp-user=
      - smtp-pass=
      - email-from=
      - email-to=
      - teams-webhook-url=
      - openai-api-key=
      - anthropic-api-key=

commonLabels:
  app.kubernetes.io/name: agent-system
  app.kubernetes.io/part-of: incident-pipeline
  app.kubernetes.io/managed-by: kustomize