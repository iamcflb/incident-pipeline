apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-redator
  namespace: agent-system
  labels:
    app: agent-redator
    role: redator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-redator
  namespace: agent-system
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    resourceNames: ["agent-config", "agent-secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: ["agent-data-pvc"]
    verbs: ["get", "list", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-redator
  namespace: agent-system
subjects:
  - kind: ServiceAccount
    name: agent-redator
    namespace: agent-system
roleRef:
  kind: Role
  name: agent-redator
  apiGroup: rbac.authorization.k8s.io
---
