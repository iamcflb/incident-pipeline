[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-redator"
version = "0.1.0"
description = "Agente Redator - Remove dados sensíveis de logs/arquivos"
requires-python = ">=3.11"
dependencies = [
    "agent-shared",
    "trufflehog3>=3.4; extra == 'trufflehog'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]
trufflehog = ["trufflehog3>=3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true