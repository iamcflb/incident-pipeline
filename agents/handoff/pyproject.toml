[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-handoff"
version = "0.1.0"
description = "Agente Handoff - Envia incidentes para times (Jira, Slack, Email)"
requires-python = ">=3.11"
dependencies = [
    "agent-shared @ file://../../shared",
    "requests>=2.31",
    "jira>=3.4; extra == 'jira'",
    "slack-sdk>=3.21; extra == 'slack'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "requests-mock>=1.11",
]
jira = ["jira>=3.4", "requests>=2.31"]
slack = ["slack-sdk>=3.21", "requests>=2.31"]
email = ["requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true