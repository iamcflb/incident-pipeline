[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-triador"
version = "0.1.0"
description = "Agente Triador - Classifica domínio de incidentes técnicos"
requires-python = ">=3.11"
dependencies = [
    "agent-shared",
    "scikit-learn>=1.3; extra == 'ml'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]
ml = ["scikit-learn>=1.3", "joblib>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true