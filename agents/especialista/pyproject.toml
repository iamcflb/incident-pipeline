[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-especialista"
version = "0.1.0"
description = "Agente Especialista - Análise profunda de incidentes ambíguos"
requires-python = ">=3.11"
dependencies = [
    "agent-shared @ file://../../shared",
    "openai>=1.0; extra == 'llm'",
    "anthropic>=0.7; extra == 'llm'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]
llm = ["openai>=1.0", "anthropic>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true